# FinovAI - Cloudflare Workers Configuration
name = "finovai"
main = "worker/index.ts"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]
account_id = "711cb78717605db93e601e6a06e7eeec"

# Static assets configuration
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "finovai-db"
database_id = "f618ec3b-b453-49dd-b16a-b4a5a2778314"

[[send_email]]
name = "EMAIL"

# Environment variables
[vars]
ENVIRONMENT = "production"
SYNCFY_ENV = "production"
EMAIL_AUTH_REQUIRED = "true"
APP_ORIGIN = "https://finov.ai"
# Cloudflare Email Sending must be onboarded for mail.finov.ai.
EMAIL_FROM = "noreply@mail.finov.ai"
OPS_ALERT_EMAIL = "sushaantu+ops@finov.ai"
CLOUDFLARE_AI_GATEWAY_COMPAT_ENDPOINT = "https://gateway.ai.cloudflare.com/v1/711cb78717605db93e601e6a06e7eeec/default/compat/chat/completions"
CLOUDFLARE_AI_GATEWAY_COMPAT_MODEL = "anthropic/claude-opus-4-7"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 * * * *"]

[env.preview]
name = "finovai-preview"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[env.preview.assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "finovai-preview-db"
database_id = "f19c9f9e-ded4-44e7-8de1-04c56cc22114"

[[env.preview.send_email]]
name = "EMAIL"

[env.preview.vars]
ENVIRONMENT = "preview"
SYNCFY_ENV = "sandbox"
EMAIL_AUTH_REQUIRED = "false"
EMAIL_FROM = "noreply@mail.finov.ai"
OPS_ALERT_EMAIL = "sushaantu+ops@finov.ai"
APP_ORIGIN = "https://finovai-preview.my-cloudflare-711.workers.dev"
CLOUDFLARE_AI_GATEWAY_COMPAT_ENDPOINT = "https://gateway.ai.cloudflare.com/v1/711cb78717605db93e601e6a06e7eeec/default/compat/chat/completions"
CLOUDFLARE_AI_GATEWAY_COMPAT_MODEL = "anthropic/claude-opus-4-7"

[env.sandbox]
name = "finovai-sandbox"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[env.sandbox.assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.sandbox.d1_databases]]
binding = "DB"
database_name = "finovai-db"
database_id = "f618ec3b-b453-49dd-b16a-b4a5a2778314"

[[env.sandbox.send_email]]
name = "EMAIL"

[env.sandbox.vars]
ENVIRONMENT = "sandbox"
SYNCFY_ENV = "sandbox"
EMAIL_AUTH_REQUIRED = "false"
EMAIL_FROM = "noreply@mail.finov.ai"
OPS_ALERT_EMAIL = "sushaantu+ops@finov.ai"
APP_ORIGIN = "http://127.0.0.1:5173"
CLOUDFLARE_AI_GATEWAY_COMPAT_ENDPOINT = "https://gateway.ai.cloudflare.com/v1/711cb78717605db93e601e6a06e7eeec/default/compat/chat/completions"
CLOUDFLARE_AI_GATEWAY_COMPAT_MODEL = "anthropic/claude-opus-4-7"

# Cloudflare AI Gateway (preferred for product chat)
#   wrangler secret put CLOUDFLARE_AI_GATEWAY_TOKEN
# Optional:
#   wrangler secret put CLOUDFLARE_AI_GATEWAY_BYOK_ALIAS
#   CLOUDFLARE_AI_GATEWAY_COMPAT_ENDPOINT can point at /compat/chat/completions
#   CLOUDFLARE_AI_GATEWAY_COMPAT_MODEL uses provider/model, for example anthropic/claude-opus-4-7
#   ANTHROPIC_API_KEY is supported only as a direct-provider fallback
#   ANTHROPIC_CHAT_MODEL defaults to claude-opus-4-8

# Kapso WhatsApp API (secrets - set via `wrangler secret put`)
# Run these commands to configure:
#   wrangler secret put KAPSO_API_KEY
#   wrangler secret put KAPSO_PHONE_NUMBER_ID
#
# Get these values from: https://kapso.ai/dashboard
# Free tier: 2,000 messages/month

# Syncfy API (secret + optional vars)
#   wrangler secret put SYNCFY_API_KEY
#   wrangler secret put SYNCFY_WEBHOOK_SECRET
#   wrangler secret put SUPPORT_ADMIN_SECRET
# Optional if Syncfy account uses non-default auth/base URL:
#   SYNCFY_API_BASE_URL defaults to https://sync.paybook.com/v1
#   SYNCFY_AUTH_HEADER_NAME defaults to Authorization
#   SYNCFY_AUTH_HEADER_VALUE defaults to "api_key api_key={api_key}"
#   SYNCFY_TRANSACTION_LOOKBACK_MONTHS defaults to 6
#   SYNCFY_TRANSACTIONS_PATH can override the default credential transaction path if needed
# Webhook URL:
#   https://finov.ai/api/syncfy/webhook
# Support dashboard:
#   https://finov.ai/admin/syncfy

# Custom domain - configured via Cloudflare dashboard
# To set up: Go to Workers & Pages > finovai > Settings > Domains & Routes > Add custom domain
